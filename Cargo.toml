[package]
name = "files_sync"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
jiff = "0.2.37"
libc = "0.2.189"
postcard = { version = "1.1.3", features = ["use-std"] }
redb = "4.3.0"
rustix = { version = "1.1.5", features = ["fs", "rand"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
# Race-injection points in fs::hooks for integration tests (tests/attack.rs, crash.rs).
hooks = []

[[test]]
name = "attack"
required-features = ["hooks"]

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
